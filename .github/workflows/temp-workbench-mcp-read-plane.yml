name: Workbench MCP Read Plane Temp Verify

on:
  push:
    branches:
      - feat-workbench-mcp-read-plane-20260817

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-workbench-mcp-read-plane-20260817
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Drizzle no drift
        run: |
          pnpm db:generate
          git diff --exit-code -- packages/db/drizzle
      - name: Format
        run: pnpm format
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: E2E
        run: xvfb-run -a pnpm test:e2e
