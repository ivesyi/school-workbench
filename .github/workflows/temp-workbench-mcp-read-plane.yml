name: Workbench MCP Read Plane Temp Verify

on:
  push:
    branches:
      - feat-workbench-mcp-read-plane-20260817

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[generated]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-workbench-mcp-read-plane-20260817
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - name: Normalize final read-plane sources
        run: |
          python - <<'PY'
          from pathlib import Path

          stdio = Path('packages/workbench-mcp/src/stdio.ts')
          text = stdio.read_text()
          text = text.replace("} from '@school-workbench/workbench-read-plane'", "} from '@school-workbench/workbench-read-plane/contracts'", 1)
          stdio.write_text(text)

          integration = Path('packages/workbench-mcp/src/stdio.integration.test.ts')
          text = integration.read_text()
          text = text.replace("readFileSync(serverBundle, 'utf8')", "readFileSync(resolve('packages/workbench-mcp/src/stdio.ts'), 'utf8')")
          integration.write_text(text)

          loopback = Path('packages/workbench-read-plane/src/loopback.ts')
          text = loopback.read_text().replace("      disableRequestLogging: true,\n", "")
          loopback.write_text(text)

          db_test = Path('packages/db/src/sqlite-read-plane-repository.test.ts')
          text = db_test.read_text()
          text = text.replace(
              "  for (const [index, input] of [\n    ['evidence-a-3'",
              "  for (const [index, input] of ([\n    ['evidence-a-3'",
              1,
          )
          text = text.replace(
              "    ['evidence-b-1', 'school-b', '2026-08-17T01:04:00.000Z', 'B1'],\n  ] as const) {\n    db.prepare(",
              "    ['evidence-b-1', 'school-b', '2026-08-17T01:04:00.000Z', 'B1'],\n  ] as const).entries()) {\n    db.prepare(",
              1,
          )
          db_test.write_text(text)

          auth_test = Path('packages/workbench-read-plane/src/auth.test.ts')
          text = auth_test.read_text()
          query_marker = "    const serializedLogs = JSON.stringify(logs)"
          if 'queryScope.status' not in text:
              query_test = "\n".join([
                  "    const queryScope = await fetch(`${endpoint}/school_context?schoolId=school-b`, {",
                  "      method: 'POST',",
                  "      headers: {",
                  "        authorization: `Bearer ${valid.token}`,",
                  "        'content-type': 'application/json',",
                  "        'x-swb-school-id': 'school-a',",
                  "        'x-swb-agent-run-id': 'run-a',",
                  "      },",
                  "      body: '{}',",
                  "    })",
                  "    expect(queryScope.status).toBe(400)",
                  "    await expect(queryScope.json()).resolves.toMatchObject({ error: { code: 'INPUT_INVALID' } })",
                  "",
              ])
              text = text.replace(query_marker, query_test + query_marker)
          auth_test.write_text(text)

          spec = Path('docs/architecture/SPEC.md')
          text = spec.read_text()
          start_marker = '# 24. Diagnosis 最小 Schema'
          new_marker = '# 24. Diagnosis strict Assessment Contract'
          end_marker = '默认不返回整本书或整个 Methodology Pack。'
          replacement = "\n".join([
              '# 24. Diagnosis strict Assessment Contract',
              '',
              'Diagnosis 的 canonical 输入边界不再维护第二套 `DiagnosisProposalInput`。',
              '',
              '正式 contract 以 `packages/assessment` 的 strict schema 为准：',
              '',
              '```text',
              'AssessmentInput',
              'AssessmentCandidate',
              '```',
              '',
              'Agent / future MCP write plane 形成候选后，Workbench 必须执行：',
              '',
              '```text',
              'validateAssessmentCandidate(input, candidate)',
              '```',
              '',
              '只有通过 strict schema、引用完整性、school/stage/methodology/provenance 与 assessment protocol 校验的 candidate，才允许映射为 immutable `DiagnosisProposal` 并进入 HumanReview。调用方不能用额外布尔位或另一套宽松 DTO 绕过 validation gate。',
              '',
              '## 24.1 Assessment Provenance',
              '',
              '`AssessmentInput` 负责提供可验证的 School、StageTarget、Evidence、ObservationFact、Claim 与 Methodology 上下文；`AssessmentCandidate` 只引用这些输入中的稳定 ID，并保持 Interpretation、Provisional Judgment、Alternative Hypothesis、Counter-evidence search、Unresolved Question 与 Action / Observation / Impact plan 分离。',
              '',
              'Workbench 保存可审核的解释与 provenance，不保存或展示模型隐藏思维过程。',
              '',
              '## 24.2 standards_get',
              '',
              '当前 read plane 的输入允许：',
              '',
              '```text',
              'packKey          required',
              'version          required',
              'schoolId         optional scope assertion only',
              'dimensionKeys    bounded canonical filter',
              'practiceType     bounded filter',
              'criterionRefs    bounded stable-id filter',
              '```',
              '',
              '至少提供 `dimensionKeys / practiceType / criterionRefs` 之一；未知值、重复值、越界 limit/filter 必须 fail closed。`schoolId` 如出现必须与 capability token / run scope 精确一致。',
              '',
              '只有 file Registry 与 persisted SQLite 中同一个 Pack 都为 `active`，并且 key/version/content hash/source fingerprint/criterion projection 精确一致时才返回内容。',
              '',
              '返回最小相关投影：',
              '',
              '```text',
              'Pack / Version / Hash Provenance',
              'Required Constructs',
              'Selected Criteria',
              'Selected Behavior Anchors',
              'Evidence Guidance',
              'Counter Indicators',
              'Inference Guardrails',
              'Source Locators',
              '```',
              '',
              '默认不返回整本书、PDF 或整个 Methodology Pack。',
          ])
          if start_marker in text:
              start = text.index(start_marker)
              end = text.index(end_marker, start) + len(end_marker)
              text = text[:start] + replacement + text[end:]
          elif new_marker not in text:
              raise SystemExit('SPEC section 24 marker not found')
          spec.write_text(text)
          PY
      - name: Install and refresh lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Format generated and changed files
        run: pnpm format:write
      - name: Commit generated artifacts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(mcp): normalize read plane artifacts [generated]"
            git push origin HEAD:feat-workbench-mcp-read-plane-20260817
          fi
      - name: Drizzle no drift
        run: |
          pnpm db:generate
          git diff --exit-code -- packages/db/drizzle
      - name: Format
        run: pnpm format
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: E2E
        run: xvfb-run -a pnpm test:e2e
