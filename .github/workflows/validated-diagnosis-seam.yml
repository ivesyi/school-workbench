name: Validated Diagnosis Seam

on:
  push:
    branches:
      - validated-diagnosis-seam-20260817

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validated-diagnosis-seam-20260817
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Drizzle no drift
        run: |
          pnpm db:generate
          git diff --exit-code -- packages/db/drizzle
      - name: Format
        run: pnpm format
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: E2E
        run: xvfb-run -a pnpm test:e2e
