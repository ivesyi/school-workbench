name: Temporary assessment semantic fix verification

on:
  push:
    branches:
      - fix-assessment-claim-scope-20260817

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-assessment-claim-scope-20260817
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply assessment formatting
        run: pnpm exec prettier --write packages/assessment/src/context.ts packages/assessment/src/contracts.test.ts packages/assessment/src/validator.ts
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install-deps chromium
      - run: xvfb-run -a pnpm test:e2e
      - name: Persist validated formatting
        run: |
          git add packages/assessment/src/context.ts packages/assessment/src/contracts.test.ts packages/assessment/src/validator.ts
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(assessment): apply validated formatting [skip ci]"
            git push origin HEAD:fix-assessment-claim-scope-20260817
          fi
