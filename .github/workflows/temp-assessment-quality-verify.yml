name: Temporary assessment quality verification

on:
  push:
    branches:
      - feat-assessment-quality-harness-20260817

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-assessment-quality-harness-20260817
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Apply repository formatting
        run: |
          pnpm exec prettier --write packages/assessment docs/development/ASSESSMENT_QUALITY_HARNESS_FOUNDATION_STATUS.md pnpm-lock.yaml
      - name: Verify Drizzle has no drift
        run: |
          pnpm --filter @school-workbench/db db:generate
          git diff --exit-code -- packages/db/drizzle
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install-deps chromium
      - run: xvfb-run -a pnpm test:e2e
      - name: Persist lockfile and formatting only after validation
        run: |
          git add pnpm-lock.yaml packages/assessment docs/development/ASSESSMENT_QUALITY_HARNESS_FOUNDATION_STATUS.md
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(assessment): sync lockfile and formatting [skip ci]"
            git push origin HEAD:feat-assessment-quality-harness-20260817
          fi
