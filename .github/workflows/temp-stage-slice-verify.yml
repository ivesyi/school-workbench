name: Temporary stage slice verification

on:
  push:
    branches:
      - ci-stage-slice-20260817
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:write
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install-deps chromium
      - run: xvfb-run -a pnpm test:e2e
      - name: Show Prettier diff
        if: always()
        run: git diff -- apps/desktop/src/renderer/features/schools/school-workspace-page.tsx packages/application/src/stage-service.test.ts packages/db/src/sqlite-stage-repository.test.ts packages/db/src/sqlite-stage-repository.ts packages/domain/src/stage.test.ts
