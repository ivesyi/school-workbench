name: Temporary stage slice verification

on:
  push:
    branches:
      - ci-stage-slice-20260817

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Inspect Drizzle generation consistency
        run: |
          pnpm db:generate
          git status --short packages/db/drizzle
          git diff -- packages/db/drizzle/meta/_journal.json
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install-deps chromium
      - run: xvfb-run -a pnpm test:e2e
