name: Temporary methodology registry verification

on:
  push:
    branches:
      - feat-methodology-registry-20260817

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-methodology-registry-20260817
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Sync lockfile and generated Drizzle artifacts
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --filter @school-workbench/db db:generate
          pnpm exec prettier --write .
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore(methodology): sync generated artifacts"
            git push origin HEAD:feat-methodology-registry-20260817
          fi
      - run: pnpm install --frozen-lockfile
      - name: Verify Drizzle has no drift
        run: |
          pnpm --filter @school-workbench/db db:generate
          git diff --exit-code -- packages/db/drizzle
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify original PDFs are absent from application output
        run: |
          if find apps/desktop/out -type f -iname '*.pdf' -print -quit | grep -q .; then
            echo 'Original PDF found in application output'
            exit 1
          fi
      - run: pnpm exec playwright install-deps chromium
      - run: xvfb-run -a pnpm test:e2e
