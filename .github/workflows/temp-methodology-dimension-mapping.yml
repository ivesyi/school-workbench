name: Methodology Dimension Mapping

on:
  push:
    branches:
      - feat-methodology-dimension-mapping-20260817

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-methodology-dimension-mapping-20260817
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Apply criterion dimension mapping
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          mappings = {
              'knowledge/methodology/schooling-by-design-v1/pack.json': {
                  'SBD.C1.RESULT_CLARITY': 'leadership',
                  'SBD.C2.EVIDENCE_BEFORE_ACTION': 'key_tasks',
                  'SBD.C3.GAP_GROUNDED': 'capability',
                  'SBD.C4.SYSTEM_ALIGNMENT': 'structure',
                  'SBD.C5.FEEDBACK_ADJUSTMENT': 'culture',
              },
              'knowledge/methodology/data-wise-v3/pack.json': {
                  'DW.C1.LEARNING_PROBLEM_QUALITY': 'key_tasks',
                  'DW.C2.PRACTICE_VISIBILITY': 'structure',
                  'DW.C3.PROBLEM_OF_PRACTICE_QUALITY': 'culture',
                  'DW.C4.INFERENCE_DISCIPLINE': 'capability',
                  'DW.C5.ACTION_IMPACT_COHERENCE': 'leadership',
              },
          }

          for filename, expected in mappings.items():
              path = Path(filename)
              pack = json.loads(path.read_text())
              seen = set()
              for criterion in pack['criteria']:
                  criterion_id = criterion['id']
                  if criterion_id in expected:
                      criterion['dimensionKey'] = expected[criterion_id]
                      seen.add(criterion_id)
              if seen != set(expected):
                  raise SystemExit(f'{filename}: criterion set mismatch: {seen!r}')
              if pack.get('behaviorAnchors') != []:
                  raise SystemExit(f'{filename}: behaviorAnchors must remain empty')
              content = dict(pack)
              content.pop('canonicalContentHash', None)
              content.pop('status', None)
              canonical = json.dumps(
                  content,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(',', ':'),
              )
              pack['canonicalContentHash'] = {
                  'algorithm': 'sha256',
                  'value': hashlib.sha256(canonical.encode('utf-8')).hexdigest(),
              }
              path.write_text(json.dumps(pack, ensure_ascii=False, indent=2) + '\n')

          test_path = Path('packages/methodology/src/loader.test.ts')
          test = test_path.read_text()
          needle = "    expect(packs.flatMap((pack) => pack.criteria)).toHaveLength(10)\n"
          assertion = """    expect(packs.flatMap((pack) => pack.criteria)).toHaveLength(10)
    expect(
      Object.fromEntries(
        packs.flatMap((pack) =>
          pack.criteria.map((criterion) => [criterion.id, criterion.dimensionKey]),
        ),
      ),
    ).toEqual({
      'SBD.C1.RESULT_CLARITY': 'leadership',
      'SBD.C2.EVIDENCE_BEFORE_ACTION': 'key_tasks',
      'SBD.C3.GAP_GROUNDED': 'capability',
      'SBD.C4.SYSTEM_ALIGNMENT': 'structure',
      'SBD.C5.FEEDBACK_ADJUSTMENT': 'culture',
      'DW.C1.LEARNING_PROBLEM_QUALITY': 'key_tasks',
      'DW.C2.PRACTICE_VISIBILITY': 'structure',
      'DW.C3.PROBLEM_OF_PRACTICE_QUALITY': 'culture',
      'DW.C4.INFERENCE_DISCIPLINE': 'capability',
      'DW.C5.ACTION_IMPACT_COHERENCE': 'leadership',
    })
"""
          if needle not in test:
              raise SystemExit('loader test insertion point not found')
          test = test.replace(needle, assertion, 1)
          test = test.replace(
              "    expect(registry.findCriteria({ dimensionKey: 'leadership' })).toHaveLength(0)",
              "    expect(registry.findCriteria({ dimensionKey: 'leadership' })).toHaveLength(2)",
              1,
          )
          test_path.write_text(test)

          crosswalk_path = Path('knowledge/methodology/WORKBENCH-METHODOLOGY-CROSSWALK.md')
          crosswalk = crosswalk_path.read_text()
          marker = '## 7. Conflict and precedence\n'
          section = """## 7. Criterion 五维主归属

`dimensionKey` 表示 Criterion 在当前 Workbench 中用于查询、路由和组织诊断联查时的**主归属**，不表示该 Criterion 只能解释该维度，也不把方法论 Criterion 变成五维成熟度锚点。

| Criterion | 主归属 |
| --- | --- |
| `SBD.C1.RESULT_CLARITY` | `leadership` |
| `SBD.C2.EVIDENCE_BEFORE_ACTION` | `key_tasks` |
| `SBD.C3.GAP_GROUNDED` | `capability` |
| `SBD.C4.SYSTEM_ALIGNMENT` | `structure` |
| `SBD.C5.FEEDBACK_ADJUSTMENT` | `culture` |
| `DW.C1.LEARNING_PROBLEM_QUALITY` | `key_tasks` |
| `DW.C2.PRACTICE_VISIBILITY` | `structure` |
| `DW.C3.PROBLEM_OF_PRACTICE_QUALITY` | `culture` |
| `DW.C4.INFERENCE_DISCIPLINE` | `capability` |
| `DW.C5.ACTION_IMPACT_COHERENCE` | `leadership` |

两个当前 Pack 的 `behaviorAnchors` 继续为空；在可靠角色专业标准源完成结构化和人审前，不为补齐表结构而编造锚点。

## 8. Conflict and precedence
"""
          if marker not in crosswalk:
              raise SystemExit('crosswalk insertion point not found')
          crosswalk_path.write_text(crosswalk.replace(marker, section, 1))
          PY
      - name: Keep raw books out of Git history
        run: |
          if git ls-files references/books | grep -q .; then
            echo 'references/books must remain untracked'
            exit 1
          fi
      - name: Format changed files
        run: pnpm format:write
      - name: Commit mapped packs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add knowledge/methodology/schooling-by-design-v1/pack.json \
                  knowledge/methodology/data-wise-v3/pack.json \
                  knowledge/methodology/WORKBENCH-METHODOLOGY-CROSSWALK.md \
                  packages/methodology/src/loader.test.ts
          git commit -m "feat(methodology): map reviewed criteria to congruence dimensions [generated]"
          git push origin HEAD:feat-methodology-dimension-mapping-20260817
      - name: Format
        run: pnpm format
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: E2E
        run: xvfb-run -a pnpm test:e2e
