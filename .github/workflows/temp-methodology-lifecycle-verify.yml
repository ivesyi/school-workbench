name: Temporary methodology lifecycle verification

on:
  push:
    branches:
      - fix-methodology-lifecycle-20260817

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-methodology-lifecycle-20260817
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Refresh status-independent pack hashes and docs
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { readFileSync, writeFileSync } from 'node:fs'

          function canonicalStringify(value) {
            if (Array.isArray(value)) return `[${value.map(canonicalStringify).join(',')}]`
            if (value && typeof value === 'object') {
              return `{${Object.keys(value)
                .sort()
                .map((key) => `${JSON.stringify(key)}:${canonicalStringify(value[key])}`)
                .join(',')}}`
            }
            const serialized = JSON.stringify(value)
            if (serialized === undefined) throw new Error('unsupported canonical value')
            return serialized
          }

          for (const path of [
            'knowledge/methodology/schooling-by-design-v1/pack.json',
            'knowledge/methodology/data-wise-v3/pack.json',
          ]) {
            const pack = JSON.parse(readFileSync(path, 'utf8'))
            const content = { ...pack }
            delete content.canonicalContentHash
            delete content.status
            const value = createHash('sha256').update(canonicalStringify(content)).digest('hex')
            pack.canonicalContentHash = { algorithm: 'sha256', value }
            writeFileSync(path, `${JSON.stringify(pack, null, 2)}\n`)
          }
          NODE
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/data/DATABASE_SCHEMA.md')
          text = path.read_text()
          old = '`content_hash` 保存结构化 Pack 去除 hash 字段后的 canonical SHA-256。'
          new = '`content_hash` 保存结构化 Pack 去除 `canonicalContentHash` 与生命周期 `status` 后的 canonical SHA-256；状态迁移不改变内容 hash。'
          if old not in text:
              raise SystemExit('DATABASE_SCHEMA content hash wording not found')
          path.write_text(text.replace(old, new, 1))
          PY
          pnpm exec prettier --write .
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "chore(methodology): refresh lifecycle-safe hashes"
            git push origin HEAD:fix-methodology-lifecycle-20260817
          fi
      - name: Verify Drizzle has no drift
        run: |
          pnpm --filter @school-workbench/db db:generate
          git diff --exit-code -- packages/db/drizzle
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify application output has no PDFs
        run: |
          if find apps/desktop/out -type f -iname '*.pdf' -print -quit | grep -q .; then
            echo 'PDF found in application output'
            exit 1
          fi
      - run: pnpm exec playwright install-deps chromium
      - run: xvfb-run -a pnpm test:e2e
