version: 1.0.0
concepts:
  - id: swb:School
    label: 学校
    kind: entity
    layer: ontic
    definition: 陪跑工作发生的学校组织边界。
  - id: swb:Person
    label: 人
    kind: entity
    layer: ontic
    definition: 具有连续身份、可在不同时间与情境承担多个角色的自然人。
  - id: swb:Team
    label: 团队
    kind: entity
    layer: ontic
    definition: 在学校变革中共同承担任务或实践的一组人。
  - id: swb:Role
    label: 角色
    kind: classification
    layer: ontic
    definition: Person 在特定学校或项目情境与时间窗内承担的专业责任位置，如校长、中层、教师、顾问、项目助理或学生。
  - id: swb:RoleAssignment
    label: 角色任职
    kind: record
    layer: ontic
    definition: Person 在特定 School 或项目情境、特定时间窗内承担某个 Role 的记录。
  - id: swb:Stage
    label: 陪跑阶段
    kind: entity
    layer: normative
    definition: 一所学校在特定时间窗内经顾问确认的陪跑阶段。
  - id: swb:DesiredResult
    label: 预期结果
    kind: entity
    layer: normative
    definition: 阶段或变革设计希望学习者、成人实践或组织达到的状态。
  - id: swb:Dimension
    label: 全等维度
    kind: classification
    layer: methodology
    definition: 五维全等模型用于组织匹配与失配诊断的维度，不自带成熟等级。
  - id: swb:MethodologyConstruct
    label: 方法论构念
    kind: classification
    layer: methodology
    definition: 外部方法论中用于组织观察、解释或评估问题的稳定概念。
  - id: swb:Criterion
    label: 判断准则
    kind: rule
    layer: methodology
    definition: 对证据、实践或差距提出明确判断要求的版本化规则。
  - id: swb:Practice
    label: 实践
    kind: entity
    layer: ontic
    definition: Person 或 Team 在具体情境中实际做出或未做出的可观察行动模式。
  - id: swb:PracticeProblem
    label: 实践问题
    kind: entity
    layer: epistemic
    definition: 基于证据提出、与学习或组织问题相关且可采取行动的实践差距描述。
  - id: swb:Evidence
    label: 依据
    kind: record
    layer: epistemic
    definition: 被实际用于分析且保留来源与定位的材料、记录或直接观察。
  - id: swb:ObservationFact
    label: 观察事实
    kind: record
    layer: epistemic
    definition: 可以回到具体 Evidence 定位、不包含评价、动机或因果推断的低推论描述。
  - id: swb:Claim
    label: 主张
    kind: record
    layer: epistemic
    definition: 关于学校现实的可被支持、反驳、修正并具有时间与范围边界的判断性陈述。
  - id: swb:DiagnosisProposal
    label: 候选判断
    kind: record
    layer: epistemic
    definition: Agent 基于 Claim、Criterion 与 Evidence 形成、等待顾问审核的暂定专业判断。
  - id: swb:HumanReview
    label: 人工审核
    kind: record
    layer: epistemic
    definition: 顾问对 DiagnosisProposal 接受、修改、驳回或要求补证的审核记录。
  - id: swb:AcceptedJudgment
    label: 正式判断
    kind: record
    layer: epistemic
    definition: 经 HumanReview 接受或修改后，可参与正式学校状态表达的判断。
  - id: swb:Assessment
    label: 状态评估
    kind: record
    layer: epistemic
    definition: 在给定 StageTarget、时间与范围下，对某维度或对象当前状态的正式评估。
  - id: swb:Action
    label: 改进行动
    kind: entity
    layer: ontic
    definition: 为改变学校现实中的实践、能力或组织条件而采取的具体行动。
  - id: swb:ImpactIndicator
    label: 影响指标
    kind: record
    layer: normative
    definition: 预先定义用于判断行动是否带来预期变化的可观察证据要求。
  - id: swb:StateSnapshot
    label: 学校状态快照
    kind: record
    layer: epistemic
    definition: 某一时间点基于当时 Evidence、经顾问确认的一组关于学校现实的正式判断与评估；它不是现实本身。
