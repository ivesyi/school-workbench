version: 1.0.0
constraints:
  - id: swb.constraint.school-scope
    severity: error
    appliesTo: instance-relations
    rule: Evidence、ObservationFact、Claim、DiagnosisProposal、HumanReview、AcceptedJudgment、Stage、Action、Assessment 与 StateSnapshot 的关联实例必须属于同一 School 范围。
  - id: swb.constraint.fact-separation
    severity: error
    appliesTo: swb:ObservationFact
    rule: ObservationFact 必须可定位且不得包含解释、评价、动机或因果判断。
  - id: swb.constraint.claim-grounding
    severity: error
    appliesTo: swb:Claim
    rule: Claim 必须声明时间窗与评估范围，并可追溯到 supporting ObservationFact；反证搜索结果必须显式记录。
  - id: swb.constraint.proposal-grounding
    severity: error
    appliesTo: swb:DiagnosisProposal
    rule: DiagnosisProposal 必须至少关联一个 Claim、一个 Criterion，并显式完成 counter-evidence 与 alternative-hypothesis 检查。
  - id: swb.constraint.human-approval
    severity: error
    appliesTo: swb:producesJudgment
    rule: 只有 Human Review Domain Service 可以由 DiagnosisProposal 形成 AcceptedJudgment。
  - id: swb.constraint.snapshot-accepted-only
    severity: error
    appliesTo: swb:StateSnapshot
    rule: StateSnapshot 只能记录 AcceptedJudgment 与由其支撑的 Assessment，不能把 DiagnosisProposal 当作正式状态。
  - id: swb.constraint.snapshot-not-reality
    severity: error
    appliesTo: swb:StateSnapshot
    rule: StateSnapshot 表达某时点经顾问确认的知识状态，不得被解释为学校客观现实本身；历史 Snapshot 不因后续新证据而原地改写。
  - id: swb.constraint.role-separation
    severity: error
    appliesTo: swb:RoleAssignment
    rule: Role 与 Person、Team 分离；校长、中层、教师、顾问、项目助理、学生等作为 Role，不建立互斥人员类型假设。
  - id: swb.constraint.congruence-no-maturity
    severity: error
    appliesTo: swb:Dimension
    rule: 五维全等模型用于组织匹配与失配分析，Dimension 本身不定义成熟等级；阶段达成状态必须相对于 Workbench StageTarget 判断。
  - id: swb.constraint.no-automatic-score
    severity: error
    appliesTo: ontology
    rule: Ontology Relation、RAG 相似度和 Methodology Construct 均不能直接生成学校得分或成熟阶段。
  - id: swb.constraint.active-immutability
    severity: error
    appliesTo: ontology-version
    rule: 只有 active 版本受不可变约束；当前 draft 在首次激活前允许校准语义。
